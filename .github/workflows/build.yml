name: build

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install pyinstaller rich textual

      - name: set VERSION from pyproject.toml
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          sed -i "s/^VERSION = .*/VERSION = \"$v\"/" src/modules/config.py

      - run: pyinstaller --onefile --name py-agent --paths src src/main.py

      - uses: actions/upload-artifact@v4
        with:
          name: py-agent
          path: dist/py-agent
