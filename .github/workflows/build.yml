name: build

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, asset: py-agent-linux-x86_64 }
          - { os: ubuntu-24.04-arm, asset: py-agent-linux-arm64 }
          - { os: macos-15-intel, asset: py-agent-macos-x86_64 }
          - { os: macos-latest, asset: py-agent-macos-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - run: pip install pyinstaller pytest rich==15.0.0 textual==8.2.8

      - run: python -m pytest tests --ignore=tests/e2e

      - name: set VERSION from pyproject.toml
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          sed -i.bak "s/^VERSION = .*/VERSION = \"$v\"/" src/modules/config.py

      - run: pyinstaller --onefile --name py-agent --paths src --add-data src/modules/prompts:modules/prompts src/main.py

      # the e2e driver uses a linux pty
      - name: e2e tests on the built binary
        if: runner.os == 'Linux'
        run: PY_AGENT_BIN=dist/py-agent python -m pytest tests/e2e

      - run: mv dist/py-agent "dist/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      # 0.0.3 and older download "py-agent" when updating, so keep it for linux x86_64
      - run: cp dist/py-agent-linux-x86_64 dist/py-agent

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
